services:
  - type: web
    name: personal-work-os-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "720"
      # Render sits behind Cloudflare, which sets this header. Check the client_ip field in the
      # request logs after deploying; if it shows Render/Cloudflare addresses, change or clear it.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
