services:
  - type: web
    name: personal-work-os-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REQUIRE_AUTH
        value: "true"
      - key: CORS_ORIGINS
        sync: false
  - type: static_site
    name: personal-work-os-web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
